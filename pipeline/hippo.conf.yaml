# Hippo Pipeline Configuration v2
# Models and modes: dual Mac Mini M4 + RTX 5060 Ti (deepbrain)

defaults:
  mode: standalone
  host: "0.0.0.0"
  port: 9998
  loop_detect: true
  loop_detect_window: 20
  loop_detect_threshold: 3
  loop_detect_similarity: 0.7
  loop_detect_action: escape

# ─── Mac Mini Models (MLX) ───────────────────────────

models:
  qwen3-4b:
    repo: "Qwen/Qwen3-4B"
    precision: "bf16"
    size_gb: 7.8
    modes: [standalone, dflash]
    dflash:
      draft_repo: "Aryagm/dflash-draft-qwen3-4b"
      draft_size_gb: 1.0
      expected_tok_s: 42
    standalone:
      expected_tok_s: 12

  gemma-3-12b:
    repo: "google/gemma-3-12b-pt"
    precision: "qat-4bit"
    size_gb: 6.9
    modes: [standalone, pipeline]
    pipeline:
      shards: 2
      r0_layers: [0, 24]
      r1_layers: [25, 47]
      expected_tok_s: 7.0
    standalone:
      expected_tok_s: 3.5

  qwen3-8b:
    repo: "Qwen/Qwen3-8B"
    precision: "bf16"
    size_gb: 15.5
    modes: [pipeline]
    pipeline:
      shards: 2
      r0_layers: [0, 24]
      r1_layers: [25, 47]
      expected_tok_s: 5.0

# ─── 5060 Ti Models (llama.cpp CUDA) ──────────────────
# Mode: llama (standalone GGUF via llama-cpp-python)

  qwen3-30b-a3b-q3:
    gguf_path: "E:\\models\\Qwen3-30B-A3B-Q3_K_M.gguf"
    size_gb: 14.0
    modes: [llama]
    llama:
      n_gpu_layers: -1
      n_ctx: 4096
      expected_tok_s: 78
      loop_detect: true
    notes: "MoE Q3, loop rate ~10-17%, LoopDetector escape required"

  qwen3-14b-q4:
    gguf_path: "E:\\models\\Qwen3-14B-Q4_K_M.gguf"
    size_gb: 9.3
    modes: [llama]
    llama:
      n_gpu_layers: -1
      n_ctx: 4096
      expected_tok_s: 41
      loop_detect: true
    notes: "Best quality on 16GB, low loop rate"

  qwen3-8b-q4:
    gguf_path: "E:\\models\\Qwen3-8B-Q4_K_M.gguf"
    size_gb: 5.2
    modes: [llama]
    llama:
      n_gpu_layers: -1
      n_ctx: 4096
      expected_tok_s: 71
      loop_detect: true
    notes: "Fast and cheap, good for code"

  gemma4-e4b-q4:
    gguf_path: "E:\\models\\Gemma4-E4B-Q4_K_M.gguf"
    size_gb: 9.6
    modes: [llama]
    llama:
      n_gpu_layers: -1
      n_ctx: 4096
      expected_tok_s: 90
      think: false
    notes: "Fastest, best for daily use, MUST disable thinking"

# ─── Hardware ─────────────────────────────────────────

hardware:
  r0:
    chip: "Apple M4"
    ram_gb: 16
    wifi_ip: "192.168.1.10"
    thunderbolt_ip: "169.254.149.29"
  r1:
    chip: "Apple M4"
    ram_gb: 16
    wifi_ip: "192.168.1.11"
    thunderbolt_ip: "169.254.149.30"
  deepbrain:
    chip: "RTX 5060 Ti 16GB"
    os: "Windows 10"
    ssh: "administrator@192.168.1.26"
    sshpass: "sshpass -p '2129482'"
    gpu_driver: "596.36 (CUDA 13.2)"
    backend: "llama-cpp-python cu124"

# ─── Memory Guard ─────────────────────────────────────

memory:
  safety_factor: 0.85
  system_reserve_gb: 4.0
  mlx_overhead_gb: 2.0
  cuda_overhead_gb: 1.5

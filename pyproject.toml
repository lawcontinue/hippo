[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hippo-llm"
version = "0.3.2"
description = "Local embedding + hybrid search for AI agents. BM25 + dense + ANN, zero external DB, Chinese-optimized."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "lawcontinue", email = "lawcontinue@users.noreply.github.com"},
]
keywords = ["embedding", "vector-search", "rag", "bm25", "hybrid-search", "local-search", "chinese-tokenizer", "sqlite", "ann", "agent-memory", "llm", "apple-silicon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "numpy>=1.24",
]

# Note: Pipeline and DFlash modes require mlx and mlx-lm (macOS only).
# Install with: pip install mlx mlx-lm

[project.optional-dependencies]
embedding = [
    "sentence-transformers>=2.2",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
web = [
    "gradio>=4.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "httpx>=0.24",
    "ruff>=0.1.0",
]
eval = [
    "scipy>=1.10",
]
all = ["hippo-llm[embedding,api,web,eval]"]

[project.urls]
Homepage = "https://github.com/lawcontinue/hippo"
Repository = "https://github.com/lawcontinue/hippo"
Issues = "https://github.com/lawcontinue/hippo/issues"

[tool.setuptools.packages.find]
include = ["pipeline*", "embedding*", "hippo*"]
# hippo* covers hippo/eval/ subpackage
exclude = ["_archived*", "tests*", "scripts*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hippo-llm"
version = "0.3.0"
description = "Local LLM inference + embedding & search in one package. Run 30B on consumer hardware, RAG without ChromaDB."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "lawcontinue", email = "lawcontinue@users.noreply.github.com"},
]
keywords = ["mlx", "llm", "inference", "distributed", "pipeline-parallelism", "speculative-decoding", "apple-silicon", "embedding", "vector-search", "rag", "bm25", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "numpy>=1.24",
]

# Note: Pipeline and DFlash modes require mlx and mlx-lm (macOS only).
# Install with: pip install mlx mlx-lm

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
web = [
    "gradio>=4.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "httpx>=0.24",
    "ruff>=0.1.0",
]
all = ["hippo-llm[api,web]"]

[project.urls]
Homepage = "https://github.com/lawcontinue/hippo"
Repository = "https://github.com/lawcontinue/hippo"
Issues = "https://github.com/lawcontinue/hippo/issues"

[tool.setuptools.packages.find]
include = ["pipeline*", "embedding*"]
exclude = ["_archived*", "tests*", "scripts*"]

[tool.ruff]
line-length = 120
target-version = "py310"
